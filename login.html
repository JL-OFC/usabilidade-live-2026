<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Entrar</title>
</head>
<body class="m-2 font-serif">
    <form action="" class="box-content max-w-[340px] mx-auto my-10 p-7 bg-white rounded-[10px] shadow-[0_8px_24px_rgba(0,0,0,.12)] flex flex-col gap-2.5">
        <h1 class="text-[2em] font-bold my-[0.67em] ">Entrar</h1>
        <p class="my-4">Acesse sua conta para continuar</p>

        <label for="email" class="text-[13px] font-semibold mt-2">Email</label>
        <input class="font-sans py-2.5 px-3 border border-[#ded0be] rounded-md text-[14px] focus-outline:none focus:border-[#1e4b41]" type="email" name="email" id="email" placeholder="voce@email.com" required>

        <label class="text-[13px] font-semibold mt-2" for="senha">Senha</label>
        <input class="font-sans py-2.5 px-3 border border-[#ded0be] rounded-md text-[14px] focus-outline:none focus:border-[#1e4b41]" type="password" name="senha" id="senha" placeholder="*******" required>

        <button type="submit" class="font-sans text-[13.333px] bg-[#1e4b41] text-white border-none p-3 rounded-md font-semibold cursor-pointer transition-colors duration-200 ease-[ease] hover:bg-[#163b33]">Entrar</button>
        <a href="#" class="text-[#0000EE] underline">Esqueci minha senha</a>
    </form>
</body>
</html>
